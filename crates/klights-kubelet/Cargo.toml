[package]
name = "klights-kubelet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
test-support = ["klights-watch/integration-test-harness"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["clock", "oldtime"] }
futures = { workspace = true }
flate2 = { workspace = true }
h2 = { workspace = true }
hyper = { workspace = true }
inotify = { workspace = true }
k8s-cri = { workspace = true }
klights-leader-api = { workspace = true }
klights-cluster-core = { workspace = true }
klights-network-api = { workspace = true }
klights-node-api = { workspace = true }
klights-node-store = { workspace = true }
klights-pod-api = { workspace = true }
klights-reconcile-api = { workspace = true }
klights-supervisor = { workspace = true }
klights-types = { workspace = true }
klights-watch = { workspace = true, default-features = false }
libc = { workspace = true }
nix = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true, features = ["transport", "codegen"] }
tower = { workspace = true }
hyper-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["std", "v4"] }

[dev-dependencies]
klights-node-datastore = { workspace = true }
klights-watch = { workspace = true, default-features = false, features = ["integration-test-harness"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
toml = { workspace = true }
trybuild = { workspace = true }
