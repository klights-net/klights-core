[package]
name = "klights-cluster-datastore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
test-support = [
    "klights-cluster-store/test-support",
]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
klights-cluster-core = { workspace = true }
klights-cluster-store = { workspace = true }
klights-supervisor = { workspace = true }
klights-types = { workspace = true }
rand_core = { workspace = true }
redb = { workspace = true }
rsa = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-rusqlite = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["std", "v4"] }

[lints]
workspace = true

[dev-dependencies]
base64 = { workspace = true }
klights-cluster-store = { workspace = true, features = ["test-support"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
