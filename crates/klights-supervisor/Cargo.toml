[package]
name = "klights-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
anyhow = "1"
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
tokio = { version = ">=1.51.0, <1.52.0", default-features = false, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-rusqlite = "0.6"
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = ">=1.51.0, <1.52.0", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
