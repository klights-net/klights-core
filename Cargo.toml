[package]
name = "klights"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "A resource-efficient, event-driven Kubernetes-compatible cluster runtime."
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage = "https://github.com/klights-net/klights-core"
documentation = "https://github.com/klights-net/klights-core/blob/main/README.md"
keywords = ["kubernetes", "k8s", "rust", "containerd", "control-plane"]
categories = ["command-line-utilities", "network-programming"]

[workspace]
resolver = "3"
members = [
    "crates/klights-types",
    "crates/klights-cluster-core",
    "crates/klights-supervisor",
    "crates/klights-internal-protobuf",
    "crates/klights-kube-protobuf",
    "crates/klights-cluster-store",
    "crates/klights-node-store",
    "crates/klights-node-api",
    "crates/klights-pod-api",
    "crates/klights-reconcile-api",
    "crates/klights-network-api",
    "crates/klights-leader-api",
    "crates/klights-leader-rpc",
    "crates/klights-watch",
    "crates/klights-cluster-datastore",
    "crates/klights-node-datastore",
    "crates/klights-replication",
    "crates/klights-networking",
    "crates/klights-kubelet",
    "crates/klights-auth",
    "crates/klights-controllers",
    "crates/klights-apiserver",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["klights-core copyright holders <lapcchan@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/klights-net/klights-core"
publish = false

[workspace.dependencies]
klights-types = { path = "crates/klights-types" }
klights-cluster-core = { path = "crates/klights-cluster-core" }
klights-cluster-datastore = { path = "crates/klights-cluster-datastore" }
klights-cluster-store = { path = "crates/klights-cluster-store" }
klights-leader-api = { path = "crates/klights-leader-api" }
klights-leader-rpc = { path = "crates/klights-leader-rpc" }
klights-watch = { path = "crates/klights-watch" }
klights-node-store = { path = "crates/klights-node-store" }
klights-node-api = { path = "crates/klights-node-api" }
klights-pod-api = { path = "crates/klights-pod-api" }
klights-reconcile-api = { path = "crates/klights-reconcile-api" }
klights-network-api = { path = "crates/klights-network-api" }
klights-auth = { path = "crates/klights-auth" }
klights-supervisor = { path = "crates/klights-supervisor" }
klights-internal-protobuf = { path = "crates/klights-internal-protobuf" }
klights-kube-protobuf = { path = "crates/klights-kube-protobuf" }
vergen = { version = "8", features = ["build", "cargo", "git", "gitcl", "rustc", "si"] }
tonic-prost-build = "0.14"
tokio = { version = ">=1.51.0, <1.52.0", features = ["rt", "rt-multi-thread", "macros", "time", "signal", "sync", "net", "process", "fs", "io-util"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws"] }
rustls = { version = "0.23", features = ["ring"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rusqlite = { version = "0.32", features = ["hooks", "backup"] }
tokio-rusqlite = "0.6"
redb = "4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_ignored = "0.1"
k8s-openapi = { version = "0.24", features = ["v1_32", "schemars"] }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
json-patch = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
uuid = { version = "1", default-features = false }
hyper = { version = "1", features = ["http1", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
bytes = "1"
futures = "0.3"
futures-core = "0.3"
anyhow = "1"
thiserror = "2"
num-bigint = "0.4"
num-traits = "0.2"
tokio-rustls = "0.26"
rustls-pemfile = "2"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
time = "0.3"
x509-parser = "0.16"
base64 = "0.22"
hostname = "0.4"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = "0.16"
k8s-pb = "0.9"
async-trait = "0.1"
k8s-cri = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std"] }
jsonwebtoken = "9"
native-tls = "0.2"
reqwest = { version = "0.11", features = ["json", "native-tls", "stream"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
urlencoding = "2"
toml = "1.1.2"
sha1 = "0.11.0"
tokio-tungstenite = "0.29.0"
sha2 = "0.11.0"
serde_yaml = "0.9.34"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib"] }
zstd = "0.13"
nix = { version = "0.31.2", features = ["process", "term", "sched", "mount", "net"] }
rtnetlink = "0.14"
rand = { version = "0.10.0", features = ["std_rng"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["pem"] }
inotify = "0.11.1"
paste = "1.0.15"
h2 = "0.4.13"
rust-cel-parser = "0.1.0"
cel = { version = "0.13.0", features = ["json"] }
nftnl = "0.9"
mnl = "0.3"
cron = "0.12"
netlink-packet-core = "0.7"
netlink-packet-core-08 = { package = "netlink-packet-core", version = "0.8" }
netlink-packet-generic-04 = { package = "netlink-packet-generic", version = "0.4" }
netlink-packet-route = "0.19"
netlink-sys = "0.8"
genetlink = "0.2.6"
netlink-packet-wireguard = "0.3.0"
x25519-dalek = { version = "2", features = ["static_secrets"] }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
aes-gcm = "0.10.3"
# memory: jemalloc global allocator. Replaces glibc malloc, whose per-thread
# arenas retain freed memory under churn and never return it to the OS
# (multi-GB RSS that never shrinks). jemalloc fragments far less and, with
# the background purge thread, returns dirty pages to the OS proactively.
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
tempfile = "3"
rstest = "0.25"
proptest = "1.11.0"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
walkdir = "2"
proc-macro2 = { version = "1", features = ["span-locations"] }

[workspace.lints.rust]
warnings = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.metadata.klights.feature-matrix.root-default]
package = "klights"
default-features = true
features = []

[workspace.metadata.klights.feature-matrix.root-full]
package = "klights"
default-features = false
features = ["full"]

[workspace.metadata.klights.feature-matrix.root-sqlcipher]
package = "klights"
default-features = false
features = ["full", "sqlcipher"]

[workspace.metadata.klights.feature-matrix.workspace-unit]
package = "*"
default-features = false
features = []

[build-dependencies]
vergen = { workspace = true }

[dependencies]
klights-types = { workspace = true }
klights-cluster-core = { workspace = true }
klights-cluster-store = { workspace = true }
klights-leader-api = { workspace = true }
klights-watch = { workspace = true }
klights-node-api = { workspace = true }
klights-node-store = { workspace = true }
klights-pod-api = { workspace = true }
klights-reconcile-api = { workspace = true }
klights-network-api = { workspace = true }
klights-auth = { workspace = true }
klights-supervisor = { workspace = true }
klights-internal-protobuf = { workspace = true }
klights-kube-protobuf = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
rusqlite = { workspace = true }
tokio-rusqlite = { workspace = true }
redb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_ignored = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
json-patch = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-stream = { workspace = true }
uuid = { workspace = true, features = ["std", "v4"] }
hyper = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
hyper-util = { workspace = true }
time = { workspace = true }
x509-parser = { workspace = true }
base64 = { workspace = true }
hostname = { workspace = true }
tonic = { workspace = true, features = ["router", "transport", "codegen", "tls-ring"] }
tonic-prost = { workspace = true }
tonic-reflection = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
prost-reflect = { workspace = true }
async-trait = { workspace = true }
k8s-cri = { workspace = true }
chrono = { workspace = true, features = ["clock", "oldtime", "wasmbind"] }
jsonwebtoken = { workspace = true }
native-tls = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
urlencoding = { workspace = true }
toml = { workspace = true }
sha1 = { workspace = true }
tokio-tungstenite = { workspace = true }
sha2 = { workspace = true }
serde_yaml = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
nix = { workspace = true }
rtnetlink = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
rsa = { workspace = true }
inotify = { workspace = true }
paste = { workspace = true }
h2 = { workspace = true }
rust-cel-parser = { workspace = true }
cel = { workspace = true }
nftnl = { workspace = true }
mnl = { workspace = true }
cron = { workspace = true }
netlink-packet-core = { workspace = true }
netlink-packet-core-08 = { workspace = true }
netlink-packet-generic-04 = { workspace = true }
netlink-packet-route = { workspace = true }
netlink-sys = { workspace = true }
genetlink = { workspace = true }
netlink-packet-wireguard = { workspace = true }
x25519-dalek = { workspace = true }
openraft = { workspace = true }
aes-gcm = { workspace = true }
# memory: jemalloc global allocator. Replaces glibc malloc, whose per-thread
# arenas retain freed memory under churn and never return it to the OS
# (multi-GB RSS that never shrinks). jemalloc fragments far less and, with
# the background purge thread, returns dirty pages to the OS proactively.
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[profile.dev]
debug = 1

[dev-dependencies]
tempfile = { workspace = true }
rstest = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
syn = { workspace = true }
walkdir = { workspace = true }
proc-macro2 = { workspace = true }

[lints]
workspace = true

[features]
default = ["full"]
full = ["sqlite", "redb", "linux-network", "containerd"]
sqlite = []
redb = []
linux-network = []
containerd = []
sqlcipher = ["sqlite", "rusqlite/bundled-sqlcipher-vendored-openssl"]
